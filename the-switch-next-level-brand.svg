<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">The Switch | Next Level</title><desc id="desc">Switch symbol linking an individual and a community, with The SWiTCH and Next Level wordmark.</desc>
<!-- Transparent, precise vector artwork optimised for dark backgrounds. -->
<g transform="translate(350,26)">
 <rect width="500" height="150" rx="75" fill="#FFF9EE" stroke="#172B3A" stroke-width="6"/>
 <path d="M250 0H425A75 75 0 0 1 500 75 A75 75 0 0 1 425 150H250Z" fill="#F17955"/>
 <!-- individual, fully inside left compartment -->
 <circle cx="105" cy="52" r="23" fill="#142C3B"/>
 <path d="M58 125c0-31 19-48 47-48s47 17 47 48v9H58Z" fill="#142C3B"/>
 <!-- central switch knob -->
 <circle cx="250" cy="75" r="70" fill="#FFF9EE" stroke="#E97A5B" stroke-width="7"/>
 <circle cx="250" cy="75" r="23" fill="#F17955"/>
 <!-- network nodes and group kept INSIDE the capsule -->
 <path d="M355 48L389 28L422 48" stroke="#FFF9EE" stroke-width="6" stroke-linecap="round" fill="none"/>
 <circle cx="355" cy="48" r="9" fill="#FFF9EE"/><circle cx="389" cy="28" r="9" fill="#FFF9EE"/><circle cx="422" cy="48" r="9" fill="#FFF9EE"/>
 <circle cx="360" cy="84" r="18" fill="#FFF9EE"/><circle cx="422" cy="84" r="18" fill="#FFF9EE"/><circle cx="391" cy="73" r="21" fill="#FFF9EE"/>
 <path d="M328 131c0-20 13-30 32-30s32 10 32 30v4h-64Z" fill="#FFF9EE"/>
 <path d="M390 131c0-20 13-30 32-30s32 10 32 30v4h-64Z" fill="#FFF9EE"/>
 <path d="M353 137c0-26 16-41 38-41s38 15 38 41v3h-76Z" fill="#FFF9EE"/>
</g>
<!-- Unified baseline and measured spacing: no overlapping wordmark segments -->
<g font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="700">
 <text x="180" y="374" font-size="62" fill="#FFF9EE">THE</text>
 <text x="337" y="374" font-size="132" fill="#FFF9EE">SW<tspan fill="#F17955">i</tspan>TCH</text>
</g>
<g font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
 <text x="600" y="472" font-size="64" letter-spacing="4" fill="#6EDBD3">NEXT LEVEL</text>
 <path d="M112 448H230M970 448H1088" stroke="#F17955" stroke-width="8" stroke-linecap="round"/>
</g>
</svg>